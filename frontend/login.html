<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>
  <body>
    <h2>Login</h2>
    <div id="loginFormContainer">
        <form id="loginForm">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" required />
          <br />
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required />
          <br />
          <button type="submit">Login</button>
        </form>
        <p id="message"></p>
      </div>
      
      <div id="main-content" style="display: none;">

    <script>
document.addEventListener("DOMContentLoaded", function () {
  console.log("JavaScript loaded successfully!"); // Log when JS is loaded

  const loginForm = document.getElementById("loginForm");

  loginForm.addEventListener("submit", function (event) {
    event.preventDefault(); // Prevent the form from submitting
    console.log("Form submission prevented!"); // Log when form submission is prevented

    // Just for testing, comment out the fetch request and see if this message logs
    alert("Form submitted, but page did not reload!"); // Simple alert to verify
  });
});

    </script>
  </body>
</html>
