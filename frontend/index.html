<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Str3aming - Browse YouTube</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        margin: 0;
      }
      #mirotalk-iframe {
        height: 50%;
        width: 100%;
        border: 0;
      }
      #search-container {
        padding: 10px;
        background-color: #f0f0f0;
      }
      #results-container {
        display: flex;
        flex-wrap: wrap;
        overflow-y: auto;
        height: 50%;
      }
      .video {
        width: 30%;
        margin: 5px;
        cursor: pointer;
      }
      iframe {
        width: 100%;
        height: 200px;
      }
      #main-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <!-- Main Interface -->
    <div id="main-container">
      <iframe
        id="mirotalk-iframe"
        allow="camera; microphone; display-capture; fullscreen; clipboard-read; clipboard-write; web-share; autoplay"
        src="https://p2p.mirotalk.com/newcall"
        style="height: 50vh; width: 100vw; border: 0px"
      ></iframe>

      <div id="search-container">
        <input type="text" id="search-input" placeholder="Search YouTube" />
        <button onclick="searchYouTube()">Search</button>
      </div>

      <div id="results-container"></div>

      <button id="loadMoreButton" onclick="searchYouTube()">Load More</button>
    </div>

    <script>
      const API_KEY = "AIzaSyDH5IQDkmzE_W-2tHt4Fbi6ZQByscWAt9Q"; // Replace with your YouTube API key
      let nextPageToken = "";

      // YouTube Search Function
      function searchYouTube() {
        const query = document.getElementById("search-input").value;
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${query}&type=video&maxResults=10&key=${API_KEY}${
          nextPageToken ? `&pageToken=${nextPageToken}` : ""
        }`;

        fetch(url)
          .then((response) => response.json())
          .then((data) => {
            const resultsContainer = document.getElementById("results-container");
            resultsContainer.innerHTML = ""; // Clear previous results

            data.items.forEach((item) => {
              const videoId = item.id.videoId;
              const title = item.snippet.title;
              const video = document.createElement("div");
              video.className = "video";
              video.innerHTML = `
                <iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>
                <p>${title}</p>
              `;
              resultsContainer.appendChild(video);
            });

            nextPageToken = data.nextPageToken || "";
          })
          .catch((error) => console.error("Error fetching YouTube videos:", error));
      }
    </script>
  </body>
</html>
