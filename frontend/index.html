<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Str3aming - Browse YouTube</title>
    <style>
      /* Styles remain unchanged */
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        margin: 0;
      }
      #mirotalk-iframe {
        height: 50%;
        width: 100%;
        border: 0;
      }
      #search-container {
        padding: 10px;
        background-color: #f0f0f0;
      }
      #results-container {
        display: flex;
        flex-wrap: wrap;
        overflow-y: auto;
        height: 50%;
      }
      .video {
        width: 30%;
        margin: 5px;
        cursor: pointer;
      }
      iframe {
        width: 100%;
        height: 200px;
      }
      #main-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <h2>Login</h2>
    <form id="loginForm">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br>
        <button type="submit">Login</button>
    </form>
    <p id="message"></p>
    <!-- In login.html -->
<p>
    <a href="register.html">Don't have an account? Register here</a>
</p>


    <!-- Link back to index.html -->
    <p>
        <a href="index.html">Go to Main Page</a>
    </p>
    <!-- Main Interface -->
    <div id="main-container">
      <iframe
        id="mirotalk-iframe"
        allow="camera; microphone; display-capture; fullscreen; clipboard-read; clipboard-write; web-share; autoplay"
        src="https://p2p.mirotalk.com/newcall"
        style="height: 50vh; width: 100vw; border: 0px"
      ></iframe>

      <div id="search-container">
        <input type="text" id="search-input" placeholder="Search YouTube" />
        <button onclick="searchYouTube()">Search</button>
      </div>

      <div id="results-container"></div>

      <!-- Play/Pause Buttons for Video Control -->
      <button id="play-button">Play</button>
      <button id="pause-button">Pause</button>

      <button id="loadMoreButton" onclick="searchYouTube()">Load More</button>
    </div>

    <script>
      const API_KEY = "AIzaSyDH5IQDkmzE_W-2tHt4Fbi6ZQByscWAt9Q"; // Your YouTube API key
      let nextPageToken = "";

      // Function to wait for the room number to be set in localStorage
      function waitForRoomNumber() {
        return new Promise((resolve) => {
          const checkRoomNumber = () => {
            const roomNumber = localStorage.getItem("mirotalkRoomId");
            if (roomNumber) {
              resolve(roomNumber);
            } else {
              setTimeout(checkRoomNumber, 500); // Check again after 500ms
            }
          };
          checkRoomNumber();
        });
      }

      // Function to send messages to the server
      let websocket;
      function sendMessage(type, data) {
        if (websocket && websocket.readyState === WebSocket.OPEN) {
          websocket.send(JSON.stringify({ type, data }));
        }
      }

      // YouTube Search Function
      function searchYouTube() {
        const query = document.getElementById("search-input").value;
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${query}&type=video&maxResults=10&key=${API_KEY}${
          nextPageToken ? `&pageToken=${nextPageToken}` : ""
        }`;

        fetch(url)
          .then((response) => response.json())
          .then((data) => {
            console.log("Fetched YouTube videos:", data);
            sendMessage("searchResults", data.items); // Send search results to all users
            displaySearchResults(data.items); // Display the search results
            nextPageToken = data.nextPageToken || "";
          })
          .catch((error) => {
            console.error("Error fetching YouTube videos:", error); // Corrected error handling
          });
      }

      // Function to display search results
      function displaySearchResults(items) {
        const resultsContainer = document.getElementById("results-container");
        resultsContainer.innerHTML = ""; // Clear previous results

        items.forEach((item) => {
          const videoId = item.id.videoId;
          const title = item.snippet.title;
          const video = document.createElement("div");
          video.className = "video";
          video.innerHTML = `
            <iframe id="your-video-element" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>
            <p>${title}</p>
          `;
          resultsContainer.appendChild(video);

          // Add click event to play the video and broadcast to others
          video.onclick = function () {
            sendMessage("play", videoId); // Send the play command
          };
        });
      }

      // Main function to initialize WebSocket connection
      async function initializeWebSocket() {
        const roomNumber = await waitForRoomNumber(); // Wait for the room number to be available
        const username = "user"; // Replace with logic to get the actual username
        console.log("Room Number from localStorage:", roomNumber);

        // Establish WebSocket connection
        websocket = new WebSocket(
          `ws://localhost:8000/ws/video_control/${roomNumber}/${username}`
        );

        // Handle incoming messages
        websocket.onmessage = function (event) {
          const message = JSON.parse(event.data);
          console.log("Message from server:", message);

          // Handle search results synchronization
          if (message.type === "searchResults") {
            displaySearchResults(message.data);
          }

          // Handle video playback control
          const videoElement = document.getElementById("your-video-element");
          if (message.type === "play" && videoElement) {
            videoElement.contentWindow.postMessage(
              '{"event":"command","func":"playVideo","args":""}',
              "*"
            );
          } else if (message.type === "pause" && videoElement) {
            videoElement.contentWindow.postMessage(
              '{"event":"command","func":"pauseVideo","args":""}',
              "*"
            );
          }
        };

        websocket.onopen = function () {
          console.log("Connected to WebSocket server");
        };

        websocket.onclose = function () {
          console.log("Disconnected from WebSocket server");
        };

        // Attach play/pause functionality to buttons
        document.getElementById("play-button").onclick = function () {
          sendMessage("play");
        };

        document.getElementById("pause-button").onclick = function () {
          sendMessage("pause");
        };
      }

      // Start the WebSocket initialization
      initializeWebSocket();
    </script>
  </body>
</html>
