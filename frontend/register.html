<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <form id="register-form" method="POST" action="/auth/register">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <button type="submit">Register</button>
    </form>

    <script>
        document.getElementById("register-form").addEventListener("submit", async function(event) {
            event.preventDefault();
            const formData = new FormData(event.target);

            console.log("Form data:", Object.fromEntries(formData.entries())); // Log form data

            try {
                const response = await fetch("/auth/register", {
                    method: "POST",
                    body: new URLSearchParams(formData)
                });

                console.log("Response status:", response.status); // Log response status

                if (response.ok) {
                    alert("Registration successful!");
                    window.location.href = "/login.html"; // Redirect to login page
                } else {
                    const error = await response.json();
                    console.log("Error response:", error); // Log error response
                    const errorMessage = error.detail ? error.detail : "Unknown error occurred.";
                    alert("Registration failed: " + errorMessage);
                }
            } catch (error) {
                console.error("Error:", error);
                alert("An error occurred. Please try again.");
            }
        });
    </script>
</body>
</html>
